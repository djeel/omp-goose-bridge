version: 2
updates:
  # Ce dépôt est géré par Bun (bun.lock) : l'écosystème npm_and_yarn est refusé par Dependabot.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
