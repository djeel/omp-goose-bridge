<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<title>OMP Bridge</title>
<script type="application/ld+json">
{"@context":"urn:goose.ai:schema","@type":"GooseApp","name":"omp-dev-panel","description":"Activité OMP en direct : runs, rôles, durées, verrou writer","width":680,"height":360,"resizable":true}
</script>
<style>
  /* Même famille que Goose (Cash Sans) ; repli système si le CDN est bloqué. */
  @font-face { font-family: 'Cash Sans'; font-weight: 300; font-style: normal; font-display: swap;
    src: url(https://cash-f.squarecdn.com/static/fonts/cashsans/woff2/CashSans-Light.woff2) format('woff2'); }
  @font-face { font-family: 'Cash Sans'; font-weight: 400; font-style: normal; font-display: swap;
    src: url(https://cash-f.squarecdn.com/static/fonts/cashsans/woff2/CashSans-Regular.woff2) format('woff2'); }
  @font-face { font-family: 'Cash Sans'; font-weight: 500; font-style: normal; font-display: swap;
    src: url(https://cash-f.squarecdn.com/static/fonts/cashsans/woff2/CashSans-Medium.woff2) format('woff2'); }
  @font-face { font-family: 'Cash Sans'; font-weight: 600; font-style: normal; font-display: swap;
    src: url(https://cash-f.squarecdn.com/static/fonts/cashsans/woff2/CashSans-Semibold.woff2) format('woff2'); }
  /* Tokens = design system de Goose (--color-*, --font-*, --border-radius-*).
     Goose les injecte dans l'app via hostContext.styles.variables ; les valeurs
     de repli sont celles du thème par défaut (dark #15141b / light #ffffff). */
  :root {
    color-scheme: dark;
    --surface: var(--color-background-primary, #15141b);
    --surface-2: var(--color-background-secondary, #1a1921);
    --fg: var(--color-text-primary, #edecee);
    --muted: var(--color-text-secondary, #8a8282);
    --faint: var(--color-text-tertiary, #6d6d6d);
    --line: var(--color-border-primary, #2d2b38);
    --line-strong: var(--color-border-secondary, #47415a);
    --accent: var(--color-text-info, #82e2ff);
    --ok: var(--color-text-success, #61ffca);
    --warn: var(--color-text-warning, #ffca85);
    --err: var(--color-text-danger, #ff6767);
    --font: var(--font-sans, 'Cash Sans', system-ui, sans-serif);
    --mono: var(--font-mono, ui-monospace, monospace);
    --fs: var(--font-text-sm-size, .875rem);
    --fs-xs: var(--font-text-xs-size, .75rem);
    --radius: var(--border-radius-md, 8px);
    --radius-sm: var(--border-radius-sm, 4px);
  }
  /* Repli thème clair (utile hors Goose : navigateur / app autonome). */
  html.light {
    color-scheme: light;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f4f6f7;
    --color-text-primary: #3f434b;
    --color-text-secondary: #61616a;
    --color-text-tertiary: #85858e;
    --color-border-primary: #e3e6ea;
    --color-border-secondary: #cbd1d6;
    --color-text-info: #5c98f9;
    --color-text-success: #91cb80;
    --color-text-warning: #fbcd44;
    --color-text-danger: #f94b4b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--surface);
    color: var(--fg);
    font: 400 var(--fs)/1.45 var(--font);
    -webkit-font-smoothing: antialiased;
    padding: 0 14px 10px;
  }

  /* ---- entête ---- */
  .bar {
    display: flex; align-items: center; gap: 8px;
    height: 38px; border-bottom: 1px solid var(--line);
  }
  .mark { font: 600 var(--fs-xs)/1 var(--font); letter-spacing: .08em; color: var(--fg); }
  .sep { width: 1px; height: 11px; background: var(--line-strong); }
  .ws {
    color: var(--muted); font: var(--fs-xs)/1.4 var(--mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch;
  }
  .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--faint); }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); display: block; }
  .live.on { color: var(--muted); }
  .live.on i { background: var(--ok); }
  .live.busy { color: var(--warn); }
  .live.busy i { background: var(--warn); animation: breathe 1.9s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 1 } 50% { opacity: .32 } }
  @media (prefers-reduced-motion: reduce) { .live.busy i, .run[data-state="running"] .dot { animation: none } }

  /* ---- bandeau de mesures ---- */
  .stats {
    display: flex; flex-wrap: wrap; gap: 0 16px; align-items: baseline;
    padding: 7px 0 8px; border-bottom: 1px solid var(--line);
    font-size: var(--fs-xs); color: var(--muted);
  }
  .s { display: inline-flex; gap: 5px; align-items: baseline; white-space: nowrap; }
  .k { color: var(--faint); font-size: calc(var(--fs-xs) - 1px); letter-spacing: .07em; text-transform: uppercase; }
  .v { font: var(--fs-xs) var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
  .v.dim { color: var(--muted); }

  /* ---- timeline ---- */
  .feed { position: relative; }
  .feed::after {
    content: ""; position: absolute; inset: auto 0 0; height: 22px;
    background: linear-gradient(to bottom, transparent, var(--surface));
    opacity: 0; transition: opacity .12s linear; pointer-events: none;
  }
  .feed.more::after { opacity: 1; }
  ol { list-style: none; margin: 0; padding: 0 2px 0 0; max-height: 236px; overflow-y: auto; overscroll-behavior: contain; }
  ol::-webkit-scrollbar { width: 7px; }
  ol::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--radius-sm); }

  li { display: grid; align-items: baseline; gap: 10px; }
  .run {
    grid-template-columns: 60px 80px minmax(0, 1fr) auto;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .run:last-child { border-bottom: 0; }
  .run:hover { background: var(--surface-2); border-radius: var(--radius-sm); }
  time { font: var(--fs-xs)/1.6 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }

  .role { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs); color: var(--muted); }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); flex: none; }
  .run[data-state="running"] .dot { background: var(--warn); animation: breathe 1.9s ease-in-out infinite; }
  .run[data-state="running"] .role { color: var(--fg); }
  .run[data-state="ok"] .dot { background: var(--ok); }
  .run[data-state="err"] .dot { background: var(--err); }
  .run[data-state="err"] .role { color: var(--err); }

  .task { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run[data-state="idle"] .task { color: var(--muted); }
  .dur {
    font: var(--fs-xs)/1.6 var(--mono); color: var(--faint);
    font-variant-numeric: tabular-nums; text-align: right;
    min-width: 46px; padding-right: 2px; white-space: nowrap;
  }
  .run[data-state="running"] .dur { color: var(--warn); }

  .note { grid-template-columns: 60px 1fr; padding: 4px 0; font-size: var(--fs-xs); color: var(--faint); }
  .note .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note b { font-weight: 500; color: var(--muted); }
  .note b.arrow { color: var(--accent); }

  .empty { padding: 16px 0 18px; color: var(--faint); font-size: var(--fs); }
  .empty b { font-weight: 500; color: var(--muted); }

  /* ---- pied ---- */
  .foot { display: flex; align-items: center; gap: 4px; height: 40px; border-top: 1px solid var(--line); }
  input#ws {
    flex: 1; min-width: 80px;
    background: transparent; border: 0; border-bottom: 1px solid transparent;
    color: var(--muted); font: var(--fs-xs) var(--mono); padding: 5px 0; outline: 0;
  }
  input#ws::placeholder { color: var(--faint); }
  input#ws:focus { color: var(--fg); border-bottom-color: var(--line-strong); }
  button {
    appearance: none; background: transparent; border: 0; border-radius: var(--radius-sm);
    color: var(--muted); font: 500 var(--fs-xs) var(--font);
    padding: 5px 7px; cursor: pointer;
  }
  button:hover { color: var(--fg); background: var(--surface-2); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

  .more { margin-top: 2px; }
  .more summary { display: inline-block; cursor: pointer; color: var(--faint); font-size: var(--fs-xs); padding: 4px 0; list-style: none; }
  .more summary::-webkit-details-marker { display: none; }
  .more summary:hover { color: var(--muted); }
  .more summary::after { content: " →"; }
  .more[open] summary::after { content: " ←"; }
  pre {
    margin: 4px 0 0; padding: 10px 12px; border-radius: var(--radius);
    background: var(--surface-2); border: 1px solid var(--line);
    max-height: 210px; overflow: auto;
    font: var(--fs-xs)/1.6 var(--mono); color: var(--muted); white-space: pre-wrap;
  }
</style>
</head>
<body>
<!--BOOTSTRAP-->

<header class="bar">
  <span class="mark">OMP</span>
  <span class="sep"></span>
  <span class="ws" id="wsLabel" title="">—</span>
  <span class="spacer"></span>
  <span class="live" id="live"><i></i><span id="liveLabel">connexion</span></span>
</header>

<section class="stats">
  <span class="s"><span class="k">runs</span><span class="v" id="kRuns">0</span></span>
  <span class="s"><span class="k">sessions</span><span class="v dim" id="kSess">0</span></span>
  <span class="s"><span class="k">writer</span><span class="v dim" id="kWriter">libre</span></span>
  <span class="s"><span class="k">pool</span><span class="v dim" id="kPool">0 · 0/0</span></span>
  <span class="s"><span class="k">git</span><span class="v dim" id="kGit">—</span></span>
  <span class="s"><span class="k">omp</span><span class="v dim" id="kOmp">—</span></span>
</section>

<section class="feed" id="feed">
  <ol id="timeline"></ol>
</section>

<footer class="bar foot">
  <input id="ws" placeholder="workspace (défaut serveur)" spellcheck="false" autocomplete="off">
  <button id="bDiff" title="git diff du workspace">diff</button>
  <button id="bList" title="sessions bridge vivantes">sessions</button>
  <button id="bHealth" title="diagnostic">santé</button>
</footer>

<details class="more"><summary>détail</summary><pre id="out">—</pre></details>

<script>
"use strict";
// Thème forcé (?theme=light|dark) pour debug/capture : prioritaire sur l'hôte.
const FORCED=new URLSearchParams(location.search).get("theme");
const FORCED_OK=FORCED==="light"||FORCED==="dark";

// --- Client MCP App : thème, resize, send-to-chat. Silencieux hors hôte. ---
class McpAppClient {
  constructor(){this.seq=0;this.pending=new Map();
    window.addEventListener("message",e=>this.onMsg(e));this.init();}
  async init(){try{
    const r=await this.req("ui/initialize",{});
    const hc=r&&r.hostContext;
    this.applyHostStyles(hc);
    this.applyTheme((hc&&hc.theme)||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
    this.notify("ui/notifications/initialized",{});this.size();
  }catch(e){this.applyTheme(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");}}
  // Goose fournit ses propres tokens (couleurs, typo, radius) : on les applique tels quels,
  // l'app hérite alors exactement du design system de l'hôte.
  applyHostStyles(hc){
    const v=hc&&hc.styles&&hc.styles.variables;
    if(v&&typeof v==="object"){
      for(const k of Object.keys(v)){
        const val=v[k];
        if(typeof val==="string")document.documentElement.style.setProperty(k,val);
      }
    }
    const fonts=hc&&hc.styles&&hc.styles.css&&hc.styles.css.fonts;
    if(typeof fonts==="string"&&fonts&&!document.getElementById("host-fonts")){
      const el=document.createElement("style");el.id="host-fonts";el.textContent=fonts;
      document.head.appendChild(el);
    }
  }
  onMsg(e){const d=e.data;if(!d||typeof d!=="object")return;
    if("id" in d&&this.pending.has(d.id)){const p=this.pending.get(d.id);
      this.pending.delete(d.id);d.error?p.reject(new Error(d.error.message)):p.resolve(d.result);return;}
    if(d.method==="ui/notifications/host-context-changed"&&d.params){
      this.applyHostStyles(d.params);
      if(d.params.theme)this.applyTheme(d.params.theme);
    }}
  req(m,p){return new Promise((res,rej)=>{const id=++this.seq;
    this.pending.set(id,{resolve:res,reject:rej});
    window.parent.postMessage({jsonrpc:"2.0",id,method:m,params:p},"*");
    setTimeout(()=>{if(this.pending.has(id)){this.pending.delete(id);rej(new Error("timeout"));}},10000);});}
  notify(m,p){window.parent.postMessage({jsonrpc:"2.0",method:m,params:p},"*");}
  applyTheme(t){document.documentElement.className=FORCED_OK?FORCED:((t==="light")?"light":"dark");}
  size(){try{this.notify("ui/notifications/size-changed",{height:Math.ceil(document.body.getBoundingClientRect().height)});}catch(e){}}
  send(text){return this.req("ui/message",{content:{type:"text",text}});}
}
const app=new McpAppClient();

// --- API locale (serve.ts) ---
function apiBase(){
  if(location.protocol==="http:"||location.protocol==="https:")return location.origin;
  return "http://127.0.0.1:"+(window.OMP_BRIDGE_HTTP||3210);
}
const TOKEN=new URLSearchParams(location.search).get("token")||"";
function wsValue(){return $("ws").value.trim();}
function authQ(){
  const w=wsValue();
  return [w?("workspace="+encodeURIComponent(w)):"",TOKEN?("token="+encodeURIComponent(TOKEN)):""].filter(Boolean).join("&");
}
async function api(tool,args){
  const h={"Content-Type":"application/json"};
  if(TOKEN)h["x-omp-bridge-token"]=TOKEN;
  const r=await fetch(apiBase()+"/mcp/"+tool,{method:"POST",headers:h,body:JSON.stringify(args||{})});
  if(!r.ok)throw new Error("HTTP "+r.status+" — "+await r.text());
  return await r.text();
}
const $=id=>document.getElementById(id);
const wsArg=()=>{const w=wsValue();return w?{workspace:w}:{};};
const setText=(id,v)=>{const el=$(id);if(el&&el.textContent!==v)el.textContent=v;};
const field=(s,k)=>{const m=new RegExp(k+"=([^\\s]+)").exec(s||"");return m?m[1]:"";};

// --- état : une ligne par run OMP (pas une ligne par événement) ---
const runs=new Map();   // session_id -> {el, roleEl, taskEl, durEl, t0, state, task}
let runCount=0;
let lastWs="";

function setLive(state,label){
  $("live").className="live"+(state?" "+state:"");
  setText("liveLabel",label);
}
function fmtDur(ms){
  const s=ms/1000;
  return s<60? s.toFixed(1)+"s" : Math.floor(s/60)+"m"+String(Math.round(s%60)).padStart(2,"0")+"s";
}
function shortWs(p){
  const parts=String(p||"").split("/").filter(Boolean);
  return parts.length<=2?p:"…/"+parts.slice(-2).join("/");
}
function hhmmss(iso){
  const d=new Date(iso);
  return isNaN(d)? "--:--:--" : d.toLocaleTimeString([], {hour12:false});
}

function makeRun(sessionId,role,ts){
  const li=document.createElement("li");
  li.className="run";
  li.dataset.state="idle";
  li.dataset.session=sessionId;
  li.innerHTML='<time></time><span class="role"><i class="dot"></i><span class="rn"></span></span>'+
               '<span class="task"></span><span class="dur"></span>';
  li.querySelector(".rn").textContent=role||"omp";
  li.querySelector("time").textContent=ts?hhmmss(ts):"--:--:--";
  li.title=sessionId;
  const ol=$("timeline");
  const empty=ol.querySelector(".empty");if(empty)empty.remove();
  ol.appendChild(li);
  const r={el:li,roleEl:li.querySelector(".rn"),taskEl:li.querySelector(".task"),
           durEl:li.querySelector(".dur"),t0:null,state:"idle",task:""};
  runs.set(sessionId,r);
  runCount++;
  setText("kRuns",String(runCount));
  return r;
}

// Lit un libellé lisible : "role=researcher | corrige le bug" (ou l'ancien format).
function taskOf(summary){
  const s=String(summary||"");
  const i=s.indexOf(" | ");
  let t=i>=0?s.slice(i+3).trim():s.replace(/^role=[^\s]+\s*/,"").replace(/^chars=\d+\s*:\s*/,"").trim();
  // Ancien format : le prompt système était loggé tel quel. On ne l'affiche pas.
  if(/^Tu es OMP /i.test(t))t="(prompt système)";
  return t;
}

function addEvent(e,fresh){
  if(!e||e.id==null)return;
  const sid=e.session_id;
  if(e.kind==="bridge_route"){
    const dec=(e.summary||"").replace(/^route\s*/,"");
    appendNote(e.ts,dec);
    return;
  }
  // Une session sans prompt n'apparaît pas : la timeline ne montre que les runs.
  if(e.kind==="bridge_session_create")return;
  if(e.kind==="prompt_sent"){
    const r=runs.get(sid)||makeRun(sid,field(e.summary,"role"),e.ts);
    r.t0=Date.parse(e.ts)||Date.now();
    r.task=taskOf(e.summary);
    r.taskEl.textContent=r.task;
    r.taskEl.title=r.task;
    r.el.dataset.state="running";
    r.state="running";
    scrollIfNear();
    updateLive();
    app.size();
    return;
  }
  if(e.kind==="prompt_done"||e.kind==="prompt_result"){
    const r=runs.get(sid);
    if(!r)return;
    const st=field(e.summary,"status");
    if(e.kind==="prompt_result"&&!fresh)return;      // le done porte la durée
    const d=/durée=([\d.]+)s/.exec(e.summary||"");
    const err=/error|failed|erreur/i.test(st);
    if(e.kind==="prompt_done"){
      r.el.dataset.state=err?"err":"ok";
      r.state=err?"err":"ok";
      r.durEl.textContent=d?(Math.round(Number(d[1])*10)/10)+"s":"";
      r.t0=null;
      updateLive();
      app.size();
    }
    return;
  }
  if(e.kind==="bridge_session_stop"){
    const r=runs.get(sid);
    if(r&&r.state==="idle"){r.el.remove();runs.delete(sid);runCount=Math.max(0,runCount-1);setText("kRuns",String(runCount));}
    return;
  }
}

function appendNote(ts,text){
  const ol=$("timeline");
  const empty=ol.querySelector(".empty");if(empty)empty.remove();
  const li=document.createElement("li");
  li.className="note";
  li.innerHTML='<time></time><span class="what"><b></b> <span></span></span>';
  li.querySelector("time").textContent=hhmmss(ts);
  const parts=splitReason(text);
  const b=li.querySelector("b");
  b.textContent=parts.head;
  if(parts.head.startsWith("→"))b.classList.add("arrow");
  li.querySelector(".what span").textContent=parts.rest;
  ol.appendChild(li);
  scrollIfNear();
  app.size();
}
function splitReason(s){
  const m=/^delegate=(true|false)\s*role=(\S+)\s*\((.*)\)\s*$/.exec(s||"");
  if(m)return{head:m[2]==="null"?"goose direct":"→ "+m[2],rest:m[3]};
  return{head:s,rest:""};
}

function scrollIfNear(){
  const ol=$("timeline");
  if(ol.scrollHeight-ol.scrollTop-ol.clientHeight<56)ol.scrollTop=ol.scrollHeight;
}
function updateFade(){
  const ol=$("timeline");
  $("feed").classList.toggle("more",ol.scrollHeight-ol.scrollTop-ol.clientHeight>2);
}
$("timeline").addEventListener("scroll",updateFade);

// Compteur des runs en cours (aucun événement requis pendant l'attente).
function updateLive(){
  const now=Date.now();
  let busy=0;
  for(const [,r] of runs){
    if(r.state!=="running"||!r.t0)continue;
    if(now-r.t0>15*60*1000){r.el.dataset.state="err";r.state="err";r.durEl.textContent="timeout";continue;}
    busy++;
    r.durEl.textContent=fmtDur(now-r.t0);
  }
  setLive(busy?"on busy":"on",busy?(busy===1?"omp travaille":"omp · "+busy+" en cours"):"live");
}
setInterval(updateLive,200);

// --- mesures ---
function renderStats(st){
  if(!st)return;
  setText("kSess",String((st.sessions||[]).length));
  setText("kWriter",st.writer||"libre");
  $("kWriter").classList.toggle("dim",!st.writer);
  if(st.pool)setText("kPool",st.pool.pooled+" · "+st.pool.hits+"/"+st.pool.misses);
  setText("kGit",st.isRepo?st.branch+(st.dirty?" ±"+st.dirty:""):"hors dépôt");
  if(st.workspace){
    setText("wsLabel",shortWs(st.workspace));
    $("wsLabel").title=st.workspace;
    if(!$("ws").value.trim())$("ws").value=st.workspace;   // le flux garde le même scope
    lastWs=st.workspace;
    app.size();
  }
}

// --- flux ---
let es=null;
function hydrate(d){
  if(!d)return;
  renderStats(d.status);
  if(d.omp_version)setText("kOmp",String(d.omp_version).replace(/^omp\//,""));
  (d.events||[]).forEach(e=>addEvent(e,false));
  if(!runs.size&&!$("timeline").children.length){
    $("timeline").innerHTML='<li class="empty">Aucun appel OMP récent. <b>Demande quelque chose à goose</b> — les runs apparaîtront ici.</li>';
  }
  scrollIfNear();updateLive();updateFade();app.size();
}
function startStream(){
  const q=authQ();
  try{es=new EventSource(apiBase()+"/stream"+(q?"?"+q:""));}
  catch(e){return poll();}
  es.addEventListener("snapshot",ev=>{hydrate(JSON.parse(ev.data));});
  es.addEventListener("event",ev=>{addEvent(JSON.parse(ev.data),true);updateFade();});
  es.addEventListener("ping",ev=>{try{const d=JSON.parse(ev.data);if(typeof d.sessions==="number")setText("kSess",String(d.sessions));}catch(e){}});
  es.onerror=()=>{setLive("","reconnexion");};
}
function poll(){
  const loop=async()=>{
    try{
      const q=authQ();
      const r=await fetch(apiBase()+"/activity"+(q?"?"+q:""));
      if(!r.ok)throw new Error("HTTP "+r.status);
      hydrate(await r.json());
    }catch(e){setLive("","hors ligne");}
    setTimeout(loop,3000);
  };loop();
}

// --- actions (le journal brut reste disponible, hors du chemin principal) ---
async function run(tool,args,label){
  $("out").textContent=label+"…";
  try{$("out").textContent=await api(tool,args);}
  catch(e){$("out").textContent="panneau HTTP injoignable — lancer : bun run panel\n"+e;}
  $(".more").open=true;app.size();
}
$("bDiff").onclick=()=>run("omp_get_diff",wsArg(),"diff");
$("bList").onclick=()=>run("omp_sessions_list",{},"sessions");
$("bHealth").onclick=async()=>{
  try{const r=await fetch(apiBase()+"/healthz");$("out").textContent=JSON.stringify(await r.json(),null,1);}
  catch(e){$("out").textContent="panneau HTTP injoignable — lancer : bun run panel\n"+e;}
  $(".more").open=true;app.size();
};
$("ws").addEventListener("change",()=>{
  if(es){es.close();es=null;}
  runs.clear();runCount=0;setText("kRuns","0");
  $("timeline").innerHTML="";
  startStream();
});
// double-clic sur la timeline : envoyer le résumé dans le chat (mode inline)
$("timeline").addEventListener("dblclick",()=>{
  const t=$("timeline").innerText.trim().slice(0,1500);
  app.send("OMP Bridge — activité :\n"+t).catch(()=>{});
});

// --- démarrage ---
const boot=$("bootstrap");
if(boot){try{hydrate(JSON.parse(boot.textContent||"{}"));}catch(e){}}
startStream();
updateFade();
</script>
